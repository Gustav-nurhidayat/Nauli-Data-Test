    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48x48.png"

    <link
      rel="icon"

    />

    <meta
      property="og:locale"

    <meta
      property="og:image"

    <meta
      property="og:image:secure_url"
      content="https://example.ltd/og-image.png"

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="Goestaf Nurhidayat"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"

    <meta
      name="twitter:image"
      content="https://Example.ltd/og-image.png"
    />

    <meta
      name="twitter:image:alt"

    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Goestaf Nurhidayat",

        "image": "https://example.ltd/og-image.png",
